[defaults]
inventory = ansible/inventory.yml
host_key_checking = False

[ssh_connection]
# Używaj wyłącznie klucza z inventory (ansible_ssh_private_key_file),
# bez kluczy z ssh-agent — inaczej agent wyczerpuje MaxAuthTries i dostajemy
# "Permission denied (publickey)" zanim ssh spróbuje właściwego klucza.
ssh_args = -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s
