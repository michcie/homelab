---
- name: Load secrets.yml
  include_vars:
    file: "{{ playbook_dir }}/secrets.yml"

- name: Install flux CLI on server
  get_url:
    url: "https://github.com/fluxcd/flux2/releases/download/v{{ flux_version }}/flux_{{ flux_version }}_linux_amd64.tar.gz"
    dest: /tmp/flux.tar.gz
    mode: "0644"

- name: Extract flux CLI on server
  unarchive:
    src: /tmp/flux.tar.gz
    dest: /usr/local/bin/
    remote_src: true
    include:
      - flux

- name: Make flux executable
  file:
    path: /usr/local/bin/flux
    mode: "0755"

- name: Check if Flux is already bootstrapped
  delegate_to: localhost
  become: false
  environment:
    KUBECONFIG: "{{ lookup('env', 'HOME') }}/.kube/homelab.yaml"
  # Sprawdzamy realną instalację Fluxa (deployment source-controller), a NIE
  # samego namespace flux-system. Rola sops tworzy ten namespace z góry (dla
  # sekretu sops-age), więc gołe "get namespace" zawsze zwracałoby rc=0 i
  # bootstrap byłby pomijany na każdym świeżym klastrze.
  command: kubectl -n flux-system get deployment source-controller
  register: flux_installed
  failed_when: false
  changed_when: false

- name: Bootstrap Flux (GitHub)
  delegate_to: localhost
  become: false
  environment:
    GITHUB_TOKEN: "{{ github_token }}"
    KUBECONFIG: "{{ lookup('env', 'HOME') }}/.kube/homelab.yaml"
  command: >
    flux bootstrap github
    --owner={{ flux_github_owner }}
    --repository={{ flux_github_repo }}
    --branch={{ flux_github_branch | default('master') }}
    --path={{ flux_github_path }}
    --personal
    --private=false
  when:
    - flux_installed.rc != 0
    - flux_github_owner != ""
    - github_token != ""

- name: Flux bootstrap skipped (missing config)
  debug:
    msg: >-
      Flux bootstrap pominięty.
      Ustaw flux_github_owner w group_vars i uruchom z GITHUB_TOKEN=<token>.
  when: flux_installed.rc != 0 and (flux_github_owner == "" or github_token == "")
