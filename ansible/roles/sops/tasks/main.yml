---
- name: Install sops binary
  get_url:
    url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.linux.amd64"
    dest: /usr/local/bin/sops
    mode: "0755"
    checksum: "sha256:https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.checksums.txt"

- name: Install age
  apt:
    name: age
    state: present
    update_cache: false

- name: Load secrets.yml
  include_vars:
    file: "{{ playbook_dir }}/secrets.yml"

- name: Create temp file for age key on server
  tempfile:
    suffix: .agekey
  register: age_tmp

- name: Write age key to temp file
  copy:
    content: "{{ age_private_key }}\n"
    dest: "{{ age_tmp.path }}"
    mode: "0600"

- name: Create sops-age Secret in flux-system namespace
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  shell: |
    kubectl -n flux-system create secret generic sops-age \
      --from-file=age.agekey={{ age_tmp.path }} \
      --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Remove temp age key file
  file:
    path: "{{ age_tmp.path }}"
    state: absent
