---
- name: Homelab provisioning
  hosts: all
  become: true
  tasks:
    - import_role:
        name: base
      tags: [base]

    - import_role:
        name: docker
      tags: [docker]

    - import_role:
        name: k3s
      tags: [k3s]

    # sops PRZED flux: secret `sops-age` musi istnieć zanim `flux bootstrap`
    # zacznie reconcile Kustomizacji z decryption.sops (inaczej lecą "sops-age not found").
    - import_role:
        name: sops
      tags: [sops]

    - import_role:
        name: flux
      tags: [flux]
