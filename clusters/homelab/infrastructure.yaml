apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 1h
  path: ./infrastructure/controllers
  prune: true
  # Czekaj aż HelmReleasy (cert-manager, Traefik) będą realnie Ready —
  # inaczej infrastructure-configs rusza zanim CRD ClusterIssuer się zarejestruje.
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
