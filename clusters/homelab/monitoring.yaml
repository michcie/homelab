apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-controllers
  namespace: flux-system
spec:
  interval: 1h
  path: ./monitoring/controllers
  prune: true
  # Czekaj aż HelmReleasy (Prometheus operator + CRD, Loki) będą Ready —
  # inaczej monitoring-configs (PodMonitor) rusza zanim CRD istnieje.
  wait: true
  timeout: 15m
  dependsOn:
    # Traefik (Ingress Grafany) + cert-manager pochodzą stąd
    - name: infrastructure-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-configs
  namespace: flux-system
spec:
  interval: 10m
  path: ./monitoring/configs
  prune: true
  dependsOn:
    - name: monitoring-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
