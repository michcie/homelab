apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  dependsOn:
    # ServiceMonitor CRD pochodzi z kube-prometheus-stack
    - name: kube-prometheus-stack
  chart:
    spec:
      chart: loki
      version: "6.x"
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      # Single-node: zamiast wbudowanego MinIO/S3 trzymamy chunki na dysku (PVC).
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 24h
        allow_structured_metadata: true
        volume_enabled: true
      pattern_ingester:
        enabled: true
      ruler:
        enable_api: true
      serviceMonitor:
        enabled: true
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 10Gi
    # Wyłącz MinIO i wszystkie inne tryby wdrożenia (zostaje tylko SingleBinary).
    minio:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
    # Datasource Loki dla Grafany — sidecar Grafany auto-importuje configmapy
    # z labelem grafana_datasource=1.
    extraObjects:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: loki-datasource
          labels:
            grafana_datasource: "1"
        data:
          loki-datasource.yaml: |-
            apiVersion: 1
            datasources:
              - name: Loki
                type: loki
                access: proxy
                url: http://loki-gateway.monitoring.svc.cluster.local
                version: 1
                isDefault: false
